<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3e3e1">
  <meta name="description" content="A personal Wordle recreation. Six guesses, one daily word, a fresh puzzle at your local midnight.">
  <title>Wordle</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <section id="welcome" class="welcome" aria-labelledby="welcome-title">
    <div class="welcome-main">
      <img class="wordle-icon" src="icon.svg" alt="" width="80" height="80">
      <h1 id="welcome-title">Wordle</h1>
      <p class="welcome-subtitle">Get 6 chances to guess<br>a 5-letter word.</p>
      <div class="welcome-buttons">
        <button class="pill primary" id="play">Play</button>
      </div>
      <div class="welcome-date"><strong id="date-label"></strong><div id="puzzle-label"></div></div>
    </div>
  </section>

  <main id="game" hidden>
    <header class="toolbar">
      <span class="game-title">Wordle</span>
      <nav aria-label="Game controls">
        <button class="icon-button" data-modal="stats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M2 11h6v11H2zM8 2h7v20H8zM15 15h7v7h-7z"/></svg></button>
        <button class="icon-button" data-modal="help" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 8a3 3 0 0 1 6 1c0 2-3 2-3 5M12 17v.5"/></svg></button>
        <button class="icon-button" data-modal="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="m10 1-.7 3-2 .9-2.6-1.5-3 5.2L4 10.5v2.7l-2.3 1.9 3 5.2 2.7-1.5 2 .9.6 3h6l.7-3 2-.9 2.6 1.5 3-5.2-2.3-1.9v-2.7l2.3-1.9-3-5.2-2.7 1.5-2-.9L16 1h-6Zm3 7a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" transform="translate(-1 -1) scale(.97)"/></svg></button>
      </nav>
    </header>
    <div class="game-content">
      <div class="board-container"><div id="board" class="board" role="group" aria-label="Wordle, six guesses of five letters"></div></div>
      <div id="feed-error" class="feed-error" hidden><p id="feed-message"></p><button class="pill" id="retry">Try again</button></div>
      <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
    </div>
  </main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <dialog id="modal" aria-labelledby="modal-title">
    <button class="close icon-button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
    <div id="modal-content"></div>
  </dialog>
  <noscript>This game requires JavaScript to play.</noscript>
</body>
</html>
